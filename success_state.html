<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Estado de interfaz de ColeCole: ¡Prenda publicada!"
    />
    <title>¡Prenda publicada! | ColeCole</title>
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/states.css" />
  </head>
  <body>
    <main class="modal-overlay">
      <section
        class="modal modal--success"
        role="dialog"
        aria-modal="true"
        aria-labelledby="state-title"
        aria-describedby="state-description"
      >
        <a
          class="modal-close"
          href="index.html"
          aria-label="Cerrar modal"
        >
          <img src="assets/icons/icon_x_transparent.svg" alt="" />
        </a>

        <div class="modal-icon modal-icon--success" aria-hidden="true">
          <img src="assets/icons/icon_success_state.svg" alt="" />
        </div>

        <div class="modal-copy">
          <h1 id="state-title">¡Prenda publicada!</h1>
          <p id="state-description">
            Tu prenda ya está visible para otras familias.
          </p>
        </div>

        <div class="modal-actions">
          <a class="button-primary" href="personal_area.html"
            >Ver mi publicación</a
          >
          <a class="text-link" href="index.html">Volver al catálogo</a>
        </div>
      </section>
    </main>
  </body>
</html>
