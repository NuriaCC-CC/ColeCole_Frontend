<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Estado de interfaz de ColeCole: Algo ha salido mal"
    />
    <title>Algo ha salido mal | ColeCole</title>
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/states.css" />
  </head>
  <body>
    <main class="modal-overlay">
      <section
        class="modal modal--error"
        role="dialog"
        aria-modal="true"
        aria-labelledby="state-title"
        aria-describedby="state-description"
      >
        <a
          class="modal-close"
          href="index.html"
          aria-label="Cerrar modal"
        >
          <img src="assets/icons/icon_x_transparent.svg" alt="" />
        </a>

        <div class="modal-icon modal-icon--error" aria-hidden="true">
          <img src="assets/icons/icon_error_state.svg" alt="" />
        </div>

        <div class="modal-copy">
          <h1 id="state-title">Algo ha salido mal</h1>
          <p id="state-description">
            No hemos podido cargar la información. Inténtalo de nuevo en unos
            segundos.
          </p>
        </div>

        <div class="modal-actions">
          <button class="button-primary" type="button" data-retry>
            Intentar de nuevo
          </button>
          <a class="text-link" href="index.html">Volver al catálogo</a>
        </div>
      </section>
    </main>
    <script src="assets/js/error_state.js"></script>
  </body>
</html>
