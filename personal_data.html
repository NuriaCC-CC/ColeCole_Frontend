<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Edición de los datos personales del perfil de ColeCole."
    />
    <title>Datos personales | ColeCole</title>
    <link rel="stylesheet" href="assets/css/variables.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/personal_data.css" />
    <link rel="stylesheet" href="assets/css/desktop_header.css" />
  </head>

  <body>
    <a class="skip-link" href="#personal-data-form"
      >Saltar a los datos personales</a
    >

    <header class="site-header">
      <div class="mobile-header">
        <div class="mobile-header-row">
          <button
            class="icon-button back-button"
            type="button"
            aria-label="Volver"
          >
            <img src="assets/icons/icon_arrow_left.png" alt="" />
          </button>
          <form class="mobile-search" role="search">
            <label class="visually-hidden" for="personal-mobile-search"
              >Buscar uniforme</label
            >
            <img src="assets/icons/icon_magnifying.png" alt="" />
            <input
              id="personal-mobile-search"
              type="search"
              name="search"
              placeholder="Buscar uniforme"
            />
          </form>
          <a
            class="icon-button cart-button"
            href="cart.html"
            aria-label="Ver carrito"
          >
            <img src="assets/icons/icon_shop_red.png" alt="" />
          </a>
          <button
            class="icon-button menu-button"
            type="button"
            aria-label="Abrir menú"
          >
            <img src="assets/icons/icon_hamburger.png" alt="" />
          </button>
        </div>
      </div>

      <div class="desktop-header">
        <a class="brand" href="index.html" aria-label="ColeCole, ir a inicio">
          <img src="assets/images/colecole_logo.png" alt="ColeCole" />
        </a>
        <form class="desktop-search" role="search">
          <div class="desktop-search-field">
            <label class="visually-hidden" for="personal-desktop-search"
              >Buscar uniforme o una talla</label
            >
            <img src="assets/icons/icon_magnifying.png" alt="" />
            <input
              id="personal-desktop-search"
              type="search"
              name="search"
              placeholder="Buscar uniforme o una talla"
            />
          </div>
          <span class="search-divider" aria-hidden="true"></span>
          <button class="school-selector" type="button">
            <img src="assets/icons/icon_school.png" alt="" />
            <span>Colegio Padres Blancos</span>
            <img
              class="chevron-icon"
              src="assets/icons/icon_chevron_up.png"
              alt=""
            />
          </button>
        </form>
        <nav class="desktop-navigation" aria-label="Navegación principal">
          <button class="header-navigation-item" type="button">
            <img src="assets/icons/icon_heart.png" alt="" />
            <span>Favoritos</span>
          </button>
          <a class="header-navigation-item" href="cart.html">
            <span class="desktop-cart-icon">
              <img src="assets/icons/icon_shop_red.png" alt="" />
            </span>
            <span>Carrito</span>
          </a>
          <button class="header-navigation-item" type="button">
            <img src="assets/icons/icon_messenger.png" alt="" />
            <span>Chat</span>
          </button>
          <a
            class="desktop-avatar-link"
            href="personal_area.html"
            aria-label="Ver perfil"
          >
            <img src="assets/images/avatar.png" alt="" />
          </a>
          <a
            class="button button-primary desktop-publish-button"
            href="publish.html"
          >
            <span>Publicar</span>
            <img src="assets/icons/icon_plus_transparent.png" alt="" />
          </a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="personal-layout">
      <aside class="profile-sidebar" aria-label="Navegación del perfil">
        <nav>
          <a href="index.html"
            ><img src="assets/icons/icon_house.png" alt="" /><span
              >Inicio</span
            ></a
          >
          <a href="index.html#catalog"
            ><img src="assets/icons/icon_magnifying.png" alt="" /><span
              >Buscar</span
            ></a
          >
          <button type="button">
            <img src="assets/icons/icon_heart.png" alt="" /><span
              >Favoritos</span
            >
          </button>
          <a class="is-current" href="personal_area.html" aria-current="page">
            <img src="assets/icons/icon_user.png" alt="" /><span>Perfil</span>
          </a>
        </nav>
      </aside>

      <section class="personal-card" aria-labelledby="personal-data-title">
        <header class="personal-card-heading">
          <h1 id="personal-data-title">Datos personales</h1>
          <p>Actualiza tu información personal</p>
        </header>

        <section class="profile-photo" aria-labelledby="profile-photo-title">
          <img
            class="profile-photo-avatar"
            src="assets/images/avatar.png"
            alt="Foto de perfil"
          />
          <div class="profile-photo-content">
            <h2 id="profile-photo-title">Tu foto de perfil</h2>
            <p>Una imagen ayuda a generar confianza en la comunidad</p>
            <button class="change-photo-button" type="button">
              Cambiar foto
            </button>
          </div>
        </section>

        <form id="personal-data-form" class="personal-form">
          <div class="form-row">
            <div class="field">
              <label for="name"
                >Nombre
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <input
                id="name"
                name="name"
                type="text"
                placeholder="Escribe tu nombre"
                required
              />
            </div>
            <div class="field">
              <label for="surname"
                >Apellidos
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <input
                id="surname"
                name="surname"
                type="text"
                placeholder="Escribe tus apellidos"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="email"
                >Correo electrónico
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <input
                id="email"
                name="email"
                type="email"
                placeholder="nombre@email.com"
                required
              />
            </div>
            <div class="field">
              <label for="phone">Teléfono</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                placeholder="600 123 456"
              />
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="school"
                >Colegio
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <select id="school" name="school" required>
                <option value="">Selecciona tu colegio</option>
                <option value="padres-blancos">Colegio Padres Blancos</option>
                <option value="salesianos">Salesianos</option>
                <option value="irlandesas">Irlandesas</option>
                <option value="maristas">Maristas</option>
                <option value="claret">Claret</option>
                <option value="santa-ana">Santa Ana</option>
              </select>
            </div>
            <div class="field">
              <label for="location"
                >Ubicación
                <span class="required-mark" aria-hidden="true">*</span></label
              >
              <select id="location" name="location" required>
                <option value="">Selecciona tu ubicación</option>
                <option value="madrid">Madrid</option>
                <option value="sevilla">Sevilla</option>
                <option value="valencia">Valencia</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button
              class="form-button cancel-button"
              id="cancel-button"
              type="button"
            >
              Cancelar
            </button>
            <button class="form-button save-button" type="submit">
              Guardar cambios
            </button>
          </div>
        </form>
      </section>
    </main>

    <nav class="mobile-bottom-navigation" aria-label="Navegación inferior">
      <a href="index.html"
        ><img src="assets/icons/icon_house.png" alt="" /><span>Inicio</span></a
      >
      <a href="index.html#catalog"
        ><img src="assets/icons/icon_magnifying.png" alt="" /><span
          >Buscar</span
        ></a
      >
      <a href="publish.html"
        ><img src="assets/icons/icon_plus.png" alt="" /><span>Publicar</span></a
      >
      <button type="button">
        <img src="assets/icons/icon_messenger.png" alt="" /><span>Chat</span>
      </button>
      <a class="is-current" href="personal_area.html" aria-current="page">
        <img src="assets/icons/icon_user.png" alt="" /><span>Perfil</span>
      </a>
    </nav>

    <div
      class="success-message"
      id="success-message"
      role="status"
      aria-live="polite"
    >
      <img src="assets/icons/icon_check.png" alt="" />
      <span>Cambios guardados correctamente</span>
    </div>

    <script src="assets/js/personal_data.js"></script>
  </body>
</html>
